[global]
daemonize = no
error_log = syslog
[pi2000]
listen = /run/pi2000-phpmyadmin/php.sock
listen.mode = 0660
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s
pm.max_requests = 300
catch_workers_output = yes
clear_env = yes
request_terminate_timeout = 320s
php_admin_value[session.save_path] = /var/lib/pi2000-phpmyadmin
php_admin_value[upload_tmp_dir] = /var/lib/pi2000-phpmyadmin
php_admin_value[open_basedir] = /usr/share/phpmyadmin:/usr/share/php:/usr/share/javascript:/usr/share/doc/phpmyadmin:/etc/phpmyadmin/config.inc.php:/etc/ssl/certs:/var/lib/pi2000-phpmyadmin
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,putenv
php_admin_flag[allow_url_fopen] = off
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[expose_php] = off
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 64M
php_admin_value[max_execution_time] = 300
php_admin_value[session.gc_maxlifetime] = 1800
php_admin_flag[session.cookie_secure] = on
php_admin_flag[session.cookie_httponly] = on

php_admin_value[error_reporting] = 8191
