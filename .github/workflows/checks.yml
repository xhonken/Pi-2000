name: Isolated application checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    # Ubuntu 24.04+ host AppArmor restrictions block nested uid maps even
    # with the container profile unconfined. Keep the Debian 13 test userspace.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    container:
      image: debian:trixie-slim
      # Bubblewrap requires nested user/PID namespaces and a fresh procfs.
      # Only this disposable CI container unmasks Docker system paths.
      options: --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined
    steps:
      - name: Install test host dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git age ca-certificates python3 python3-venv nodejs npm chromium bubblewrap ffmpeg mariadb-server openssl iputils-ping iproute2 php-cli xvfb x11-xserver-utils caddy
      - uses: actions/checkout@v6
      - name: Create an unprivileged test environment
        run: |
          useradd --create-home --shell /bin/bash pi2000-test
          chown -R pi2000-test:pi2000-test "$GITHUB_WORKSPACE"
          runuser -u pi2000-test -- python3 -m venv .venv
          runuser -u pi2000-test -- .venv/bin/pip install -r server/requirements.txt
          runuser -u pi2000-test -- npm ci --ignore-scripts
      - name: Verify nested sandbox support
        run: runuser -u pi2000-test -- bwrap --unshare-all --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib --ro-bind-try /lib64 /lib64 --proc /proc --dev /dev -- /usr/bin/true
      - name: Backend, geometry and all ordinary UI checks
        run: runuser -u pi2000-test -- .venv/bin/python scripts/check.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: disposable-ui-artifacts
          path: .test-results/
          retention-days: 7
